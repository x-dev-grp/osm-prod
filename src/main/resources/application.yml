server:
  address: 0.0.0.0
  port: ${SERVER_PORT:8083}
  max-http-request-header-size: 32KB
  error:
    include-message: always
    include-binding-errors: always
onesignal:
  app-id: e548b208-cac7-4a46-833b-e2ad16add4ac
  api-key: os_v2_app_4velecgky5fenaz34kwrnlouvqfrkkmn2xuebsu67orcddmxhzdwahpph7rbaqrqbaw4o5dl2fg5z52kkk3u6jy47lxmikwg3vjjuuy
  endpoint: "https://onesignal.com/api/v1/notifications"

spring:
  application:
    name: ${SPRING_APP_NAME:oilproductionservice}

  main:
    banner-mode: console
    allow-bean-definition-overriding: true
  #main:
    #banner-mode: console
    # ============================================================
    # Ajouté pour permettre le remplacement du bean qrMappingRepository
    # (évite l'erreur "already defined" au démarrage)
    # ============================================================
    #allow-bean-definition-overriding: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/osmproduction}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:root}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  data:
    jdbc:
      dialect: postgresql

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER:xdevgroupe@gmail.com}
    password: ${MAIL_PASS:changeme}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS:true}
          timeout: ${MAIL_TIMEOUT:5000}
          connectiontimeout: ${MAIL_CONN_TIMEOUT:5000}
      messages:
        cache-duration: PT1S

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8088}
          jwk-set-uri: ${JWK_SET_URI:http://localhost:8088/oauth2/jwks}

  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 10000
            readTimeout: 60000
            loggerLevel: full

eureka:
  client:
    registry-fetch-interval-seconds: 5
    wait-for-registry-sync: false
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    hostname: ${HOSTNAME:localhost}
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15
    metadata-map:
      startup: ${random.int}

# Configuration des opérations offline
offline:
  sync:
    max-retry: 3
    retention-days: 30
    batch-size: 100
    retry-interval: 1800000

# Configuration du logging
logging:
  level:
    com.osm.oilproductionservice: DEBUG
    com.xdev: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    feign: DEBUG
    com.netflix.discovery: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/oilproductionservice.log
    max-size: 10MB
    max-history: 10

# Configuration SpringDoc OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
  packages-to-scan: com.osm.oilproductionservice.controller
  paths-to-match: /api/**

# Configuration Actuator
management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus"
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
  # ============================================================
  # Correction de la propriété dépréciée :
  # management.metrics.export.prometheus.enabled → management.prometheus.metrics.export.enabled
  # ============================================================
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# Configuration des threads pour les tâches asynchrones
task:
  execution:
    pool:
      core-size: 5
      max-size: 10
      queue-capacity: 100
      keep-alive: 60s
    thread-name-prefix: "offline-sync-"
  scheduling:
    pool:
      size: 5
    thread-name-prefix: "offline-scheduler-"

inventory:
  service:
    url: ${INVENTORY_SERVICE_URL:http://localhost:1234}